  path: ${raw_dir}/finngen_R12_L12_LICHENSIMPLEX.gz
  url: null
  format: finngen
  build: hg38
  source: FinnGen R12
  # Case/control counts are in the R12 manifest (Risteys: https://risteys.finngen.fi/endpoints/L12_LICHENSIMPLEX).
  n_cases: null
  n_controls: null
  sample_size: null
model_types: [eqtl]
tissues: all
# Example bcftools filter applied before harmonization (GWAS-VCF FORMAT fields):
vcf_filter: "FORMAT/AF>=0.001 && FORMAT/AF<=0.999"
